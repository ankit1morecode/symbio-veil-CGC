services:
  - type: web
    name: symbio-veil-api
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: REQUIRE_MONGODB
        value: "true"
      - key: MONGODB_URI
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
